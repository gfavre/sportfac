{% load i18n sekizai_tags %}

{% if not inline %}<p class="hidden-print text-center">{% endif %}
  <button class="btn btn-secondary btn-large pdf-download-button" data-url="{{ pdf_url }}" data-filename="facture-{{ bill.billing_identifier }}.pdf">
    <i class="icon-file-pdf"></i>&nbsp;
    <!-- "pdf-btn-label", not "label": Bootstrap's own .label (small pill/badge component)
         forces font-size: 11.844px, shrinking this text far below the button's actual
         btn-large size - and only this span had that class, so the button visibly
         changed size the moment it swapped to the (unaffected) "Generating..." span. -->
    <span class="pdf-btn-label">{% translate "Download PDF" %}</span>
    <span class="pdf-btn-loading" style="display: none;">{% translate "Generating PDF…" %}</span>
  </button>
{% if not inline %}</p>{% endif %}

{% addtoblock "js" %}
  <script>
    (function () {
      var $button = $('.pdf-download-button');

      function poll(url, filename) {
        fetch(url, {credentials: 'same-origin'}).then(function (response) {
          var contentType = response.headers.get('Content-Type') || '';
          if (contentType.indexOf('application/pdf') !== -1) {
            return response.blob().then(function (blob) {
              var blobUrl = window.URL.createObjectURL(blob);
              var link = document.createElement('a');
              link.href = blobUrl;
              link.download = filename;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              window.URL.revokeObjectURL(blobUrl);
              $button.prop('disabled', false);
              $button.find('.pdf-btn-label').show();
              $button.find('.pdf-btn-loading').hide();
            });
          }
          // Still generating (HTTP 202, JSON "pending" body) - keep polling.
          setTimeout(function () { poll(url, filename); }, 3000);
        }).catch(function () {
          setTimeout(function () { poll(url, filename); }, 3000);
        });
      }

      $button.click(function () {
        $button.prop('disabled', true);
        $button.find('.pdf-btn-label').hide();
        $button.find('.pdf-btn-loading').show();
        poll($button.data('url'), $button.data('filename'));
      });
    })();
  </script>
{% endaddtoblock %}
